<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ID">
<meta name="theme-color" content="#e6e8fa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>ID Card Layout</title>
<script src="qrcode.min.js"></script>
<style>
  :root {
    --bg: #e6e8fa;
    --sub: #8d8d96;
    --blue: #0b5be0;
    --track: #e6e8ee;
    --navy: #07173d;
    --top: env(safe-area-inset-top, 0px);
    --bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: #cfd2ea; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: flex; justify-content: center; min-height: 100vh; min-height: 100dvh;
  }
  body.lock { overflow: hidden; }
  button { font-family: inherit; }

  /* ---------- 캡쳐 방지 ---------- */
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  img { -webkit-user-drag: none; pointer-events: none; }
  .banner { touch-action: manipulation; }
  #cover { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; background: var(--navy); color: #fff; font-size: 17px; text-align: center; padding: 24px; }
  body.covered #cover { display: flex; }
  @media print { body > * { display: none !important; } body::after { content: '인쇄할 수 없습니다'; } }

  /* ---------- card ---------- */
  .phone {
    position: relative; width: 100%; max-width: 420px; min-height: 100vh; min-height: 100dvh;
    background: var(--bg); display: flex; flex-direction: column; overflow: hidden;
    padding: calc(36px + var(--top)) 16px var(--bottom);
  }
  .topbar { margin: calc(-36px - var(--top)) -16px 24px; padding-top: var(--top); background: var(--bg) center/100% 100% no-repeat; flex: none; box-sizing: content-box; }
  .topbar { position: relative; }
  .tb-in { display: none; height: 100%; align-items: center; gap: 12px; padding: 0 16px; color: #1d2040; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; }
  .tb-in span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .tb-ic { width: 26px; height: 26px; flex: none; object-fit: contain; }
  .topbar[data-mode=text] .tb-in { display: flex; }
  .grp[data-mode=text] .m-image, .grp[data-mode=image] .m-text { display: none; }
  .seg { display: flex; margin-left: auto; background: #eef0f6; border-radius: 9px; padding: 2px; }
  .seg button { border: 0; background: transparent; border-radius: 7px; padding: 6px 12px; font-size: 13px; color: #555; cursor: pointer; }
  .seg button[aria-pressed=true] { background: #fff; color: #111; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .card { background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 2px 10px rgba(30,40,120,.08); }
  .photo { display: flex; justify-content: center; padding-top: 32px; }
  .photo img { width: 58%; aspect-ratio: 3/4; object-fit: cover; background: #f1f2f6; display: block; }
  .info { display: flex; justify-content: space-between; align-items: center; padding: 44px 28px 0; gap: 12px; }
  .name { font-size: 26px; line-height: 1.2; }
  .birth { font-size: 28px; margin-top: 6px; letter-spacing: .5px; }
  .addr, .addr2 { font-size: 14px; color: var(--sub); }
  .addr { margin-top: 12px; }
  .addr2 { margin-top: 4px; display: none; }
  .idline { display: none; margin-top: 10px; font-size: 16px; letter-spacing: .3px; white-space: nowrap; color: #444; }
  #qr { width: 120px; height: 120px; flex: none; }
  #qr img, #qr canvas { width: 100% !important; height: 100% !important; display: block; }
  #swWrap { display: none; width: 120px; flex: none; justify-content: flex-end; }

  /* detail mode */
  .detail .birth, .detail #qr { display: none; }
  .detail .idline { display: block; }
  .detail .idline + .addr { margin-top: 6px; }
  .detail .addr, .detail .addr2 { font-size: 16px; }
  .detail .addr2:not(:empty) { display: block; }
  .detail #swWrap { display: flex; }
  .sw { width: 56px; height: 32px; border-radius: 16px; border: 0; background: #c9ccd8; position: relative; cursor: pointer; padding: 0; transition: background .2s; }
  .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
  .sw[aria-checked=true] { background: var(--blue); }
  .sw[aria-checked=true]::after { transform: translateX(24px); }

  .timer { padding: 28px 28px 0; }
  .bar { height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .bar i { display: block; height: 100%; background: #1f57d6; width: 100%; transition: width 1s linear; }
  .time-row { display: flex; justify-content: space-between; margin-top: 14px; font-size: 17px; color: #555; }
  .hint { text-align: center; font-size: 11px; color: #c4c4cc; padding: 22px 0; }
  .detail-btn { width: 100%; border: 0; background: var(--blue); color: #fff; font-size: 19px; padding: 28px 0; cursor: pointer; }
  .banner {
    margin: 28px -16px 0; height: 62px; flex: none; overflow: hidden; display: flex; align-items: center;
    background: linear-gradient(90deg, #1ec6f0, #5b8cf0 60%, #9a6fe0); color: #fff; font-size: 17px;
  }
  .banner span { white-space: nowrap; padding-left: 100%; animation: marq 12s linear infinite; }
  @keyframes marq { to { transform: translateX(-100%); } }
  @media (prefers-reduced-motion: reduce) { .banner span { animation-duration: 40s; } .bar i { transition: none; } }

  /* ---------- edit sheet ---------- */
  .panel { position: fixed; inset: 0; background: rgba(15,20,50,.45); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .panel.open { display: flex; }
  .sheet { width: 100%; max-width: 420px; max-height: 90vh; max-height: 90dvh; background: #f3f4fa; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet-h { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px 6px; }
  .sheet-h h2 { margin: 0; font-size: 18px; }
  .x { width: 30px; height: 30px; border-radius: 50%; border: 0; background: #e2e4ef; color: #555; font-size: 16px; cursor: pointer; line-height: 1; }
  .sheet-b { overflow: auto; padding: 0 14px 12px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .sheet-f { padding: 10px 14px calc(14px + var(--bottom)); border-top: 1px solid #e2e4ef; background: #f3f4fa; }
  .gt { margin: 16px 6px 6px; font-size: 12px; font-weight: 600; color: #7a7d92; }
  .grp { background: #fff; border-radius: 14px; padding: 0 14px; }
  .f { display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid #eef0f6; }
  .f:last-child { border-bottom: 0; }
  .f > label { flex: 0 0 92px; font-size: 14px; color: #3b3e52; }
  .f input[type=text], .f input[type=number] {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 12px 0;
    font: inherit; font-size: 16px; text-align: right; color: #111;
  }
  .f input::placeholder { color: #b5b8c8; }
  .f .thumb { width: 36px; height: 36px; border-radius: 8px; background: #eef0f6 center/cover no-repeat; margin-left: auto; flex: none; }
  .btn { border: 1px solid #d5d7e2; background: #fff; border-radius: 9px; padding: 8px 12px; font-size: 13px; color: #333; cursor: pointer; flex: none; }
  .btn.danger { color: #d33; }
  .btn.primary { width: 100%; padding: 14px; font-size: 16px; background: var(--blue); border-color: var(--blue); color: #fff; border-radius: 12px; }
  .note { font-size: 12px; color: #8a8da2; margin: 6px 6px 0; line-height: 1.4; }
  .grp textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; font-size: 13px; padding: 12px 0; font-family: ui-monospace, Menlo, monospace; color: #444; }
  .tools { display: flex; gap: 8px; padding: 10px 0; border-top: 1px solid #eef0f6; }
  .tools .btn { flex: 1; }
  .toast { position: fixed; left: 50%; bottom: calc(90px + var(--bottom)); transform: translateX(-50%); background: rgba(20,22,40,.9); color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 14px; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div class="phone">
  <div class="topbar" id="topbar"><div class="tb-in"><img class="tb-ic" id="tbIcon" alt="" hidden><span id="tbText"></span></div></div>

  <div class="card" id="card">
    <div class="photo"><img id="photo" alt=""></div>
    <div class="info">
      <div>
        <div class="name" id="vName"></div>
        <div class="birth" id="vBirth"></div>
        <div class="idline" id="vId"></div>
        <div class="addr" id="vAddr"></div>
        <div class="addr2" id="vAddr2"></div>
      </div>
      <div id="qr"></div>
      <div id="swWrap"><button class="sw" id="sw" role="switch" aria-checked="false" aria-label="전체 보기"></button></div>
    </div>
    <div class="timer">
      <div class="bar"><i id="barFill"></i></div>
      <div class="time-row"><span id="vTimeLabel"></span><span id="vTime"></span></div>
    </div>
    <div class="hint" id="vHint"></div>
    <button class="detail-btn" id="vBtn"></button>
  </div>

  <div class="banner" id="banner"><span id="vBanner"></span></div>
</div>

<div class="panel" id="panel" role="dialog" aria-modal="true" aria-label="내용 편집">
  <div class="sheet">
    <div class="sheet-h"><h2>내용 편집</h2><button class="x" id="close" aria-label="닫기">✕</button></div>
    <div class="sheet-b">
      <div class="gt">상단 바</div>
      <div class="grp" id="topGrp">
        <div class="f"><label>표시 방식</label>
          <div class="seg"><button data-m="text">글자+아이콘</button><button data-m="image">이미지</button></div></div>
        <div class="f m-text"><label>글자</label><input type="text" id="fTopText" maxlength="40"></div>
        <div class="f m-text"><label>아이콘</label><div class="thumb" id="pvTopIcon"></div>
          <button class="btn" id="bTopIcon">변경</button><button class="btn danger" id="clearTopIcon">제거</button></div>
        <div class="f m-image"><label>이미지</label><div class="thumb" id="pvTop"></div>
          <button class="btn" id="bTop">변경</button><button class="btn danger" id="clearTop">제거</button></div>
        <div class="f"><label>바 높이</label><input type="number" id="fTopH" min="0" max="200" inputmode="numeric" placeholder="px"></div>
      </div>
      <div class="gt">사진</div>
      <div class="grp">
        <div class="f"><label>사진</label><div class="thumb" id="pvPhoto"></div>
          <button class="btn" id="bPhoto">변경</button><button class="btn danger" id="clearPhoto">제거</button></div>
      </div>
      <input type="file" id="fTopIcon" accept="image/*">
      <input type="file" id="fTop" accept="image/*"><input type="file" id="fPhoto" accept="image/*">

      <div class="gt">홈 화면 아이콘</div>
      <div class="grp">
        <div class="f"><label>앱 아이콘</label><div class="thumb" id="pvIcon"></div>
          <button class="btn" id="bIcon">변경</button><button class="btn danger" id="clearIcon">기본값</button></div>
        <div class="f"><label>앱 이름</label><input type="text" id="fAppName" maxlength="12" placeholder="ID"></div>
      </div>
      <input type="file" id="fIcon" accept="image/*">
      <div class="note">홈 화면에 <b>추가하기 전에</b> 설정해야 반영됩니다. 이미 추가했다면 앱을 삭제한 뒤 Safari에서 다시 추가하세요.</div>

      <div class="gt">기본 정보</div>
      <div class="grp">
        <div class="f"><label>이름</label><input type="text" id="fName"></div>
        <div class="f"><label>생년월일</label><input type="text" id="fBirth" placeholder="00.00.00"></div>
        <div class="f"><label>주소</label><input type="text" id="fAddr"></div>
      </div>

      <div class="gt">상세정보</div>
      <div class="grp">
        <div class="f"><label>일련번호</label><input type="text" id="fIdnum" placeholder="000000-0000000" inputmode="numeric"></div>
        <div class="f"><label>세부주소</label><input type="text" id="fAddr2"></div>
        <div class="f"><label>표시 버튼</label><input type="text" id="fBtn"></div>
        <div class="f"><label>숨기기 버튼</label><input type="text" id="fBtnHide"></div>
      </div>
      <div class="note">스위치를 켜기 전에는 일련번호 뒷부분과 세부주소의 숫자가 *로 가려집니다.</div>

      <div class="gt">QR · 타이머</div>
      <div class="grp">
        <div class="f"><label>QR 내용</label><input type="text" id="fQr"></div>
        <div class="f"><label>타이머</label><input type="number" id="fSecs" min="1" max="3600" inputmode="numeric" placeholder="초"></div>
        <div class="f"><label>타이머 라벨</label><input type="text" id="fTimeLabel"></div>
        <div class="f"><label>안내 문구</label><input type="text" id="fHint"></div>
      </div>

      <div class="gt">배너</div>
      <div class="grp">
        <div class="f"><label>배너 문구</label><input type="text" id="fBanner"></div>
      </div>

      <div class="gt">백업 · 초기화</div>
      <div class="grp">
        <textarea id="fBackup" rows="2" placeholder="백업 코드를 붙여넣고 ‘가져오기’를 누르세요"></textarea>
        <div class="tools">
          <button class="btn" id="exp">내보내기</button>
          <button class="btn" id="imp">가져오기</button>
          <button class="btn danger" id="reset">초기화</button>
        </div>
      </div>
      <div class="note">홈 화면 앱은 Safari와 저장 공간이 달라서, 처음 옮길 때는 내보내기 → 가져오기를 사용하세요.</div>
    </div>
    <div class="sheet-f"><button class="btn primary" id="save">저장</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="cover">캡쳐방지 시스템이 작동 중입니다</div>

<script>
const $ = id => document.getElementById(id);
const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"><rect width="300" height="400" fill="#eef0f6"/><circle cx="150" cy="150" r="62" fill="#c3c8d8"/><path d="M30 400c0-85 54-140 120-140s120 55 120 140z" fill="#c3c8d8"/></svg>');
const DEFAULTS = {
  name: '홍길동', birth: '00.01.01', addr: '서울특별시 OO구', addr2: 'OO아파트 101동 101호',
  idnum: '000000-0000000', btn: '상세정보 표시', btnHide: '상세정보 숨기기',
  qr: 'SAMPLE-ID-0000', secs: 30, timeLabel: '남은시간', hint: 'QR코드를 리더기에 스캔하세요',
  banner: '캡쳐방지 시스템이 작동 중입니다. 캡쳐방지', photo: '', topimg: '', topH: 36,
  icon: '', appName: 'ID',
  topMode: 'text', topText: '주민등록증 모바일 확인 서비스', topIcon: ''
};
const IMG_KEYS = ['photo', 'topimg', 'icon', 'topIcon'];

// 저장/백업 데이터 검증: 알려진 키와 타입만 허용, 이미지는 data:image 만 허용
function sanitize(src) {
  const out = Object.assign({}, DEFAULTS);
  if (!src || typeof src !== 'object') return out;
  if (!src.topMode && src.topimg) src = Object.assign({}, src, { topMode: 'image' }); // 이전 버전 데이터 호환
  for (const k in DEFAULTS) {
    const v = src[k];
    if (typeof v !== typeof DEFAULTS[k]) continue;
    if (IMG_KEYS.includes(k) && v && !v.startsWith('data:image/')) continue;
    out[k] = v;
  }
  out.secs = Math.min(3600, Math.max(1, Math.round(out.secs) || DEFAULTS.secs));
  out.topMode = out.topMode === 'image' ? 'image' : 'text';
  out.topH = Math.min(200, Math.max(0, Math.round(out.topH) || 0));
  return out;
}
let data;
try { data = sanitize(JSON.parse(localStorage.getItem('idcard'))); } catch (e) { data = sanitize(); }
let draft = data, showDetail = false, revealed = false, endAt = 0, timer;

/* ---------- 렌더링 ---------- */
function maskId(t) { return Array.from(t).map((c, i) => (i >= 8 && /\d/.test(c)) ? '*' : c).join(''); }
function applyDetail() {
  $('card').classList.toggle('detail', showDetail);
  $('sw').setAttribute('aria-checked', revealed);
  $('vId').textContent = revealed ? data.idnum : maskId(data.idnum);
  $('vAddr2').textContent = revealed ? data.addr2 : data.addr2.replace(/\d/g, '*');
  $('vBtn').textContent = showDetail ? data.btnHide : data.btn;
}
// 폴더에 banner-img.* / icon-img.* 파일이 있으면 각각 상단 바 아이콘 / 앱 아이콘의 기본값으로 사용
const assets = { banner: '', icon: '' };
function findAsset(base) {
  const exts = ['png', 'webp', 'jpg', 'jpeg', 'svg'];
  return new Promise(res => {
    let i = 0;
    const next = () => {
      if (i >= exts.length) return res('');
      const u = base + '.' + exts[i++], im = new Image();
      im.onload = () => res(u); im.onerror = next; im.src = u;
    };
    next();
  });
}
// 홈 화면에 추가할 때 쓰이는 아이콘/이름 (추가하기 전에 설정해야 반영됨)
function applyIcon() {
  let l = document.querySelector('link[rel="apple-touch-icon"]');
  if (!l) { l = document.createElement('link'); l.rel = 'apple-touch-icon'; document.head.appendChild(l); }
  l.href = data.icon || assets.icon || 'icon-180.png';
  const name = data.appName.trim() || 'ID';
  const m = document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if (m) m.content = name;
}
function applyTop(o) {
  const t = $('topbar'), text = o.topMode === 'text';
  t.dataset.mode = o.topMode;
  t.style.height = o.topH + 'px';
  t.style.backgroundImage = !text && o.topimg ? 'url("' + o.topimg + '")' : 'none';
  $('tbText').textContent = o.topText;
  const ic = o.topIcon || assets.banner;
  $('tbIcon').hidden = !ic;
  if (ic) $('tbIcon').src = ic;
}
function render() {
  $('vName').textContent = data.name;
  $('vBirth').textContent = data.birth;
  $('vAddr').textContent = data.addr;
  $('vTimeLabel').textContent = data.timeLabel;
  $('vHint').textContent = data.hint;
  $('vBanner').textContent = data.banner;
  applyTop(data);
  applyIcon();
  $('photo').src = data.photo || PLACEHOLDER;
  applyDetail();
  drawQr();
  startTimer();
}

/* ---------- QR / 타이머 ---------- */
function token(n) {
  const c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789', a = new Uint8Array(n);
  crypto.getRandomValues(a);
  return Array.from(a, v => c[v % c.length]).join('');
}
function drawQr() {
  $('qr').innerHTML = '';
  const payload = (data.qr || '-') + '|' + Date.now().toString(36) + '|' + token(64);
  try { new QRCode($('qr'), { text: payload, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.H }); } catch (e) {}
}
function startTimer() {
  clearInterval(timer);
  endAt = Date.now() + data.secs * 1000;
  tick(); timer = setInterval(tick, 250);
}
let lastShown = -1;
function tick() {
  let left = Math.ceil((endAt - Date.now()) / 1000);
  if (left <= 0) { endAt = Date.now() + data.secs * 1000; left = data.secs; drawQr(); }
  if (left === lastShown) return;
  lastShown = left;
  $('vTime').textContent = left + '초';
  $('barFill').style.width = (left / data.secs * 100) + '%';
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

/* ---------- 저장 ---------- */
function persist() {
  try { localStorage.setItem('idcard', JSON.stringify(data)); return true; }
  catch (e) { toast('저장 공간이 부족합니다. 더 작은 이미지를 사용하세요.'); return false; }
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

/* 큰 이미지는 축소해서 저장 (저장공간 절약) */
function readImage(file, maxW, cb) {
  const url = URL.createObjectURL(file), im = new Image();
  im.onload = () => {
    const k = Math.min(1, maxW / im.width), c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    const x = c.getContext('2d'), jpeg = file.type === 'image/jpeg';
    if (jpeg) { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); } // JPEG는 투명을 못 담으므로 흰 배경
    x.drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    cb(c.toDataURL(jpeg ? 'image/jpeg' : 'image/png', .88)); // PNG/WebP/GIF 등은 투명도 유지
  };
  im.onerror = () => { URL.revokeObjectURL(url); toast('이미지를 불러올 수 없습니다.'); };
  im.src = url;
}

/* 아이콘: 가운데 기준 정사각형으로 잘라 180px PNG로 저장 */
function readIcon(file, cb) {
  const url = URL.createObjectURL(file), im = new Image();
  im.onload = () => {
    const n = 180, c = document.createElement('canvas'), x = c.getContext('2d');
    c.width = c.height = n;
    x.fillStyle = '#fff'; x.fillRect(0, 0, n, n);
    const side = Math.min(im.width, im.height);
    x.drawImage(im, (im.width - side) / 2, (im.height - side) / 2, side, side, 0, 0, n, n);
    URL.revokeObjectURL(url);
    cb(c.toDataURL('image/png'));
  };
  im.onerror = () => { URL.revokeObjectURL(url); toast('이미지를 불러올 수 없습니다.'); };
  im.src = url;
}

/* ---------- 편집 시트 ---------- */
const TEXT = { appName: 'fAppName', topText: 'fTopText', name: 'fName', birth: 'fBirth', addr: 'fAddr', addr2: 'fAddr2', idnum: 'fIdnum', btn: 'fBtn', btnHide: 'fBtnHide',
               qr: 'fQr', timeLabel: 'fTimeLabel', hint: 'fHint', banner: 'fBanner' };
const NUM = { secs: 'fSecs', topH: 'fTopH' };
function preview() {
  $('pvTop').style.backgroundImage = draft.topimg ? 'url("' + draft.topimg + '")' : 'none';
  applyTop(Object.assign({}, draft, { topH: Math.min(200, Math.max(0, parseInt($('fTopH').value, 10) || 0)), topText: $('fTopText').value }));
  const ti = draft.topIcon || assets.banner;
  $('pvTopIcon').style.backgroundImage = ti ? 'url("' + ti + '")' : 'none';
  $('topGrp').dataset.mode = draft.topMode;
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === draft.topMode));
  $('pvIcon').style.backgroundImage = 'url("' + (draft.icon || assets.icon || 'icon-180.png') + '")';
  $('pvPhoto').style.backgroundImage = 'url("' + (draft.photo || PLACEHOLDER) + '")';
}
function openPanel() {
  draft = Object.assign({}, data);
  for (const k in TEXT) $(TEXT[k]).value = draft[k];
  for (const k in NUM) $(NUM[k]).value = draft[k];
  $('fBackup').value = '';
  preview();
  $('panel').classList.add('open'); document.body.classList.add('lock');
}
function closePanel() { applyTop(data); $('panel').classList.remove('open'); document.body.classList.remove('lock'); }
function collect() {
  const d = Object.assign({}, draft);
  for (const k in TEXT) d[k] = $(TEXT[k]).value;
  for (const k in NUM) d[k] = parseInt($(NUM[k]).value, 10);
  return sanitize(d);
}

$('close').onclick = closePanel;
$('fTopH').addEventListener('input', preview);
$('panel').onclick = e => { if (e.target === $('panel')) closePanel(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
$('save').onclick = () => {
  const prev = data;
  data = collect();
  if (!persist()) { data = prev; return; }
  render(); closePanel(); toast('저장되었습니다');
};

$('bTopIcon').onclick = () => $('fTopIcon').click();
$('fTopIcon').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) readImage(f, 96, u => { draft.topIcon = u; preview(); }); };
$('clearTopIcon').onclick = () => { draft.topIcon = ''; preview(); };
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { draft.topMode = b.dataset.m; preview(); });
$('fTopText').addEventListener('input', preview);
$('bTop').onclick = () => $('fTop').click();
$('bPhoto').onclick = () => $('fPhoto').click();
$('fTop').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) readImage(f, 1400, u => { draft.topimg = u; preview(); }); };
$('fPhoto').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) readImage(f, 700, u => { draft.photo = u; preview(); }); };
$('bIcon').onclick = () => $('fIcon').click();
$('fIcon').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) readIcon(f, u => { draft.icon = u; preview(); }); };
$('clearIcon').onclick = () => { draft.icon = ''; preview(); };
$('clearTop').onclick = () => { draft.topimg = ''; preview(); };
$('clearPhoto').onclick = () => { draft.photo = ''; preview(); };

const b64 = o => { let s = ''; new TextEncoder().encode(JSON.stringify(o)).forEach(x => s += String.fromCharCode(x)); return btoa(s); };
const unb64 = t => JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(t), c => c.charCodeAt(0))));
$('exp').onclick = async () => {
  const code = b64(collect()); $('fBackup').value = code; $('fBackup').select();
  try { await navigator.clipboard.writeText(code); toast('백업 코드가 복사되었습니다'); } catch (e) { toast('위 코드를 직접 복사하세요'); }
};
$('imp').onclick = () => {
  try {
    data = sanitize(unb64($('fBackup').value.trim()));
    persist(); render(); openPanel(); toast('가져왔습니다');
  } catch (e) { toast('올바르지 않은 백업 코드입니다'); }
};
$('reset').onclick = () => {
  if (!confirm('모든 내용을 기본값으로 되돌립니다. 계속할까요?')) return;
  data = sanitize(); persist(); render(); openPanel(); toast('초기화되었습니다');
};

/* ---------- 캡쳐 방지 ---------- */
// 웹에서 가능한 범위: 앱이 가려지거나(앱 전환/화면 녹화 시작 직전 포커스 이탈) 캡쳐 단축키가 눌리면 화면을 가림
let coverTimer;
const cover = on => document.body.classList.toggle('covered', on);
const uncoverIfActive = () => { if (!document.hidden) cover(false); };
const clearClip = () => { try { navigator.clipboard.writeText('').catch(() => {}); } catch (_) {} };
document.addEventListener('visibilitychange', () => document.hidden ? cover(true) : uncoverIfActive());
window.addEventListener('pagehide', () => cover(true));
window.addEventListener('pageshow', uncoverIfActive);
window.addEventListener('blur', () => cover(true));
window.addEventListener('focus', uncoverIfActive);
function flashCover(ms) { cover(true); clearTimeout(coverTimer); coverTimer = setTimeout(uncoverIfActive, ms); }
document.addEventListener('keydown', e => {
  const shot = e.key === 'PrintScreen' || e.key === 'Snapshot' || (e.metaKey && e.shiftKey && ['Digit3', 'Digit4', 'Digit5'].includes(e.code)) || (e.metaKey && e.key === 'p') || (e.ctrlKey && e.key === 'p');
  if (shot) { e.preventDefault(); flashCover(1500); clearClip(); }
});
document.addEventListener('keyup', e => { if (e.key === 'PrintScreen') { flashCover(1500); clearClip(); } });
document.addEventListener('contextmenu', e => { if (!(e.target.closest && e.target.closest('input, textarea'))) e.preventDefault(); });
document.addEventListener('dragstart', e => e.preventDefault());
window.addEventListener('beforeprint', () => cover(true));
window.addEventListener('afterprint', uncoverIfActive);
$('cover').addEventListener('click', uncoverIfActive); // 가림 화면이 남아 있으면 탭해서 해제

/* 배너를 3번 연속 누르면 편집창 열기 */
let taps = 0, tapT;
$('banner').addEventListener('click', () => {
  taps++; clearTimeout(tapT); tapT = setTimeout(() => taps = 0, 600);
  if (taps >= 3) { taps = 0; openPanel(); }
});

/* ---------- 카드 동작 ---------- */
$('vBtn').onclick = () => { showDetail = !showDetail; revealed = false; applyDetail(); };
$('sw').onclick = () => { revealed = !revealed; applyDetail(); };

render();
Promise.all([findAsset('banner-img'), findAsset('icon-img')]).then(([b, i]) => {
  assets.banner = b; assets.icon = i;
  applyTop(data); applyIcon();
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
